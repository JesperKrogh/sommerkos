services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./images-web:/app/images-web:ro
      - ./images/captions.md:/app/images/captions.md
      - ./data:/app/data
    environment:
      - IMAGES_WEB_DIR=/app/images-web
      - CAPTIONS_FILE=/app/images/captions.md
      - CAPTION_ADMIN_TOKEN=${CAPTION_ADMIN_TOKEN:-}
    expose:
      - "5000"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:80"
    volumes:
      - ./images-web:/usr/share/nginx/images-web:ro
      - ./images-overview:/usr/share/nginx/images-overview:ro
    depends_on:
      - api
    restart: unless-stopped
