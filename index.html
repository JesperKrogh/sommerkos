<!DOCTYPE html>
<html lang="da" data-lang="da">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="KØS Sejlsport — Sejlglæde i Svanemøllen Havn. Hold, flåde, events og sommercamp for alle aldre." />
  <meta property="og:title" content="KØS Sejlsport — Svanemøllen Havn" />
  <meta property="og:description" content="Sejlglæde for alle — fra Mini-Sejler til J70. Kom forbi Svanemøllen Havn." />
  <meta property="og:type" content="website" />

  <title>KØS Sejlsport — Svanemøllen Havn</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="stylesheet" href="/src/style/base.css" />
  <link rel="stylesheet" href="/src/style/animations.css" />
  <link rel="stylesheet" href="/src/style/components.css" />
  <link rel="stylesheet" href="/src/style/pages.css" />
</head>
<body>

  <!-- ── Navigation ─────────────────────────────────────────────────────── -->
  <nav class="nav" id="nav">
    <div class="nav__inner">
      <a href="/" class="nav__logo" data-link aria-label="KØS Sejlsport">
        <img src="/logo-kos.png" alt="KØS Sejlsport" style="height:40px;width:auto;" />
      </a>

      <div class="nav__actions">
        <a href="/hold" class="nav__link" data-link>
          <span class="da">Hold</span><span class="en">Teams</span>
        </a>
        <a href="/events/sommercamps" class="nav__link" data-link>
          <span class="da">Tilmelding</span><span class="en">Sign up</span>
        </a>
        <a href="/#events-overview" class="nav__link" data-link>
          <span class="da">Events</span><span class="en">Events</span>
        </a>
        <a href="/om" class="nav__link" data-link>
          <span class="da">Om</span><span class="en">About</span>
        </a>
        <button class="lang-toggle" id="langToggle" aria-label="Toggle language">
          <span class="lang-toggle__option" data-lang-label="da">DA</span>
          <span class="lang-toggle__divider">|</span>
          <span class="lang-toggle__option" data-lang-label="en">EN</span>
        </button>
        <button class="hamburger" id="hamburger" aria-label="Menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>

    <!-- Mobile menu -->
    <div class="nav__mobile" id="mobileMenu">
      <a href="/hold" class="nav__mobile-link" data-link><span class="da">Hold</span><span class="en">Teams</span></a>
      <a href="/events/sommercamps" class="nav__mobile-link" data-link><span class="da">Tilmelding</span><span class="en">Sign up</span></a>
      <a href="/#events-overview" class="nav__mobile-link" data-link><span class="da">Events</span><span class="en">Events</span></a>
      <a href="/om" class="nav__mobile-link" data-link><span class="da">Om</span><span class="en">About</span></a>
    </div>
  </nav>

  <!-- ── App Container (SPA content rendered here) ──────────────────────── -->
  <main id="app"></main>

  <!-- Lightbox overlay -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
    <button class="lightbox__close" id="lightboxClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
    <button class="lightbox__prev" id="lightboxPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="lightbox__img-wrap" id="lightboxImgWrap"></div>
    <button class="lightbox__next" id="lightboxNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
