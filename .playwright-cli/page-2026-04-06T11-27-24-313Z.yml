      - generic [ref=e23]:
        - heading "Vedtægter" [level=2] [ref=e24]
        - generic [ref=e25]: "**§ 1. Navn, hjemsted og stander** Klubbens navn er **KØS Sejlsport**, der forkortes **KØS**. Klubben har hjemsted i Københavns Kommune. Klubbens stander har mørk blå bundfarve. Herpå ses en hvid svane med 3 små unger. **§ 2. Klubbens formål** - at etablere og drive gode og trygge faciliteter og rammer for sejlads for børn og unge i alderen 4-25 år. - at introducere og udvikle børn og unges glæde og færdigheder knyttet til sejlads og andre nært relaterede oplevelser ved og på vandet - at understøtte børn og unges trivsel, fællesskab og forståelse for det gode kammeratskab i nærhed med naturen - at sikre en høj grad af forståelse for sikkerhed, miljø og bæredygtighed på og ved vandet. - at give medlemmerne viden, praktiske færdigheder i sejlads med joller og kølbåde samt evt. flerskrogsbåde. - at inspirere og udvikle udvalgte sejlere, forældre, ledere og trænere til at varetage undervisningen og træning af klubbens medlemmer. - at støtte og opmuntre medlemmerne til at deltage i lokale, nationale og internationale sejlsports stævner. - at arrangere udflugter, sommerferie, ungdomsstævner, kapsejladser og andre sociale tiltag for klubbens medlemmer. **§ 3. Dansk Sejlunion** Klubben er medlem af Dansk Sejlunion (DS) og er underlagt DS's vedtægter og bestemmelser. **§ 4. Optagelse af medlemmer** Som medlemmer kan optages børn og unge fra det fyldte 4. år til og med det år, hvor de fylder 25 år. Aktivt medlemskab ophører med udgangen af det år, hvor medlemmer fylder 25 år. **§ 5. Kontingent** Kontingentet for det faste medlemskab fastsættes for ét år ad gangen på den ordinære generalforsamling. **§ 6. Udmeldelse og eksklusion** Udmeldelse af klubben skal ske skriftligt. Ved kontingentrestance over 3 måneder, kan bestyrelsen ekskludere medlemmet. **§ 7. Ordinær generalforsamling** Generalforsamlingen, der er klubbens øverste myndighed, afholdes hvert år i marts måned. **§ 8. Ekstraordinær generalforsamling** Ekstraordinær generalforsamling indkaldes af bestyrelsen, når den finder det nødvendigt eller når mindst 20% af de stemmeberettigede medlemmer anmoder om det. **§ 9. Bestyrelse** Klubben ledes af en bestyrelse på mindst 5 og max 8 personer. Bestyrelsen konstituerer sig efter generalforsamlingen. **§ 10. Regnskab og revision** Regnskabsåret følger kalenderåret. Årsregnskabet forelægges generalforsamlingen til godkendelse. **§ 11. Klubbens opløsning** I tilfælde af klubbens opløsning skal de aktiver, der er i behold, anvendes til ungdomsarbejde i K.A.S, ØSF og Sejlklubben Sundet. *Vedtægter besluttet på generalforsamlingen den 19. marts 2024.*"
