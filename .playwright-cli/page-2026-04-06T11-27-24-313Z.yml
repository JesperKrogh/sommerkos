      - generic [ref=e82]:
        - heading "Sikkerhedspolitik" [level=2] [ref=e83]
        - generic [ref=e84]: "## Mål Sikkerhed er vores højeste prioritet i KØS Sejlsport. Vores mål er at sikre, at ingen kommer til skade under aktiviteterne, og at både sejlere, trænere og forældre føler sig trygge. ## Trænere Trænernes kompetencer og adfærd er afgørende for sikkerheden. Derfor fokuserer vi på: - Faglige færdigheder inden for sejlads og svømning. - Førstehjælp og livredning. - Sikker sejlads med følgebåde. ## Sejlere **Krav til jollesejlere:** - En årlig kæntringsprøve under kontrollerede forhold. - Dokumentation for, at de kan svømme 200 meter (med svømmevest og våddragt). **Påkrævet sikkerhedsudstyr:** - Alle sejlere og forældre skal altid bære godkendte redningsveste eller svømmeveste på jollerampen, broer og i bådene. - Selvoppustelige redningsveste er ikke tilladt. ## Følgebåde - Speedbådskørekort kræves. - Medbringelse af VHF-radio og \"Mand-overbord\"-sikringssnor. - Hastighedsbegrænsningen i Svanemøllebugten er 6 knob. ## Nødhjælp - Nødhjælpskasse i klubhuset. - Redningskranse på optimistskuret. - Hjertestarter ved Sejlklubben Sundets indgang. *Gældende fra maj 2024*"
      - generic [ref=e85]:
        - heading "Udmeldelse" [level=2] [ref=e86]
        - generic [ref=e87]: "## Forlader du os? Det er vi selvfølgeligt kede af! Vi håber du har haft en god tid i KØS og gerne vil anbefale os til venner og bekendte. ## Sådan foregår udmelding Udmeldelse sker via vores Google Formular: [Link til udmeldelse](https://forms.gle/qPGCjq6VU5Nj4UwbA) Formularen stiller lidt spørgsmål fordi vi super gerne vil vide hvad vi har gjort godt og kan gøre endnu bedre. Udmeldelse fra Holdsport vil efterfølgende ske manuelt fra klubbens side. Tusind tak for din tid i KØS Sejlsport - vi håber at se dig på vandet igen senere."