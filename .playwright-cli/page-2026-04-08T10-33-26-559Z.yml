- generic [ref=e2]: "{ \"site\": { \"name\": \"KØS Sejlsport\", \"tagline_da\": \"Sejlglæde i Svanemøllen Havn siden 1984\", \"tagline_en\": \"Sailing joy at Svanemøllen Harbour since 1984\", \"address\": \"Svaneknoppen 5, 2100 København Ø\", \"email\": \"bestyrelsen@kossejlsport.dk\", \"website\": \"https://www.kossejlsport.dk\", \"facebook\": \"https://www.facebook.com/kossejlsport\" }, \"about\": { \"vedtaegter\": { \"title_da\": \"Vedtægter\", \"title_en\": \"Constitution\", \"sections_da\": [ { \"title\": \"§ 1. Navn, hjemsted og stander\", \"text\": \"Klubbens navn er KØS Sejlsport, der forkortes KØS. Klubben har hjemsted i Københavns Kommune. Klubbens stander har mørk blå bundfarve. Herpå ses en hvid svane med 3 små unger.\" }, { \"title\": \"§ 2. Klubbens formål\", \"text\": \"at etablere og drive gode og trygge faciliteter og rammer for sejlads for børn og unge i alderen 4-25 år. at introducere og udvikle børn og unges glæde og færdigheder knyttet til sejlads og andre nært relaterede oplevelser ved og på vandet. at understøtte børn og unges trivsel, fællesskab og forståelse for det gode kammeratskab i nærhed med naturen. at sikre en høj grad af forståelse for sikkerhed, miljø og bæredygtighed på og ved vandet. at give medlemmerne viden, praktiske færdigheder i sejlads med joller og kølbåde samt evt. flerskrogsbåde. at inspirere og udvikle udvalgte sejlere, forældre, ledere og trænere til at varetage undervisningen og træning af klubbens medlemmer. at støtte og opmuntre medlemmerne til at deltage i lokale, nationale og internationale sejlsports stævner. at arrangere udflugter, sommerferie, ungdomsstævner, kapsejladser og andre sociale tiltag for klubbens medlemmer.\" }, { \"title\": \"§ 3. Dansk Sejlunion\", \"text\": \"Klubben er medlem af Dansk Sejlunion (DS) og er underlagt DS's vedtægter og bestemmelser.\" }, { \"title\": \"§ 4. Optagelse af medlemmer\", \"text\": \"Som medlemmer kan optages børn og unge fra det fyldte 4. år til og med det år, hvor de fylder 25 år. Aktivt medlemskab ophører med udgangen af det år, hvor medlemmer fylder 25 år.\" }, { \"title\": \"§ 5. Kontingent\", \"text\": \"Kontingentet for det faste medlemskab fastsættes for ét år ad gangen på den ordinære generalforsamling. Kontingentet kan være differentieret ift. holdtype og alder. Bestyrelsen fastsætter, hvor mange rater årskontingentet deles op i.\" }, { \"title\": \"§ 6. Udmeldelse og eksklusion\", \"text\": \"Udmeldelse af klubben skal ske skriftligt. Ved kontingentrestance over 3 måneder, kan bestyrelsen ekskludere medlemmet.\" }, { \"title\": \"§ 7. Ordinær generalforsamling\", \"text\": \"Generalforsamlingen, der er klubbens øverste myndighed, afholdes hvert år i marts måned.\" }, { \"title\": \"§ 9. Bestyrelse\", \"text\": \"Klubben ledes af en bestyrelse på mindst 5 og max 8 personer. Bestyrelsen konstituerer sig efter generalforsamlingen.\" }, { \"title\": \"§ 10. Regnskab og revision\", \"text\": \"Regnskabsåret følger kalenderåret. Årsregnskabet forelægges generalforsamlingen til godkendelse.\" } ], \"sections_en\": [ { \"title\": \"§ 1. Name, residence and pennant\", \"text\": \"The club's name is KØS Sejlsport, abbreviated KØS. The club is based in Copenhagen Municipality.\" }, { \"title\": \"§ 2. Club purpose\", \"text\": \"To establish and operate good and safe facilities for sailing for children and youth aged 4-25. To introduce and develop children's joy and skills related to sailing and other water experiences. To support children's well-being and community. To ensure understanding for safety, environment and sustainability.\" }, { \"title\": \"§ 3. Danish Sailing Association\", \"text\": \"The club is a member of the Danish Sailing Association (DS).\" }, { \"title\": \"§ 4. Membership\", \"text\": \"Children and youth from age 4 to age 25 can become members.\" }, { \"title\": \"§ 5. Subscription\", \"text\": \"The subscription is determined annually at the general meeting.\" }, { \"title\": \"§ 6. Resignation and exclusion\", \"text\": \"Resignation must be made in writing.\" }, { \"title\": \"§ 7. Ordinary general meeting\", \"text\": \"The general meeting is held annually in March.\" }, { \"title\": \"§ 9. Board\", \"text\": \"The club is managed by a board of 5-8 members.\" }, { \"title\": \"§ 10. Accounts and audit\", \"text\": \"The financial year follows the calendar year.\" } ] }, \"bestyrelsen\": { \"title_da\": \"Bestyrelsen\", \"title_en\": \"The Board\", \"members_da\": [ { \"name\": \"Henning Seehausen\", \"role\": \"Formand\", \"bio\": \"Forældre og mangeårig deltager som frivillig i foreningsarbejde. Formand siden januar 2023. Sejlet siden ungdommen. Brænder for at skabe gode rammer for vores børn og unge.\", \"phone\": \"52390400\", \"email\": \"hse@sandwalk.dk\" }, { \"name\": \"Peter Ottesen\", \"role\": \"Økonomiansvarlig\", \"bio\": \"Far til sejler på begynderholdet. Med i bestyrelsen siden marts 2024. Derudover formand i JolleKolle.\", \"phone\": \"40271025\", \"email\": \"p_ottesen@icloud.com\" }, { \"name\": \"Jesper Krogh\", \"role\": \"Bestyrelsesmedlem + træner begynder torsdag\", \"bio\": \"Far til 2 begyndersejlere i KØS. Har været aktiv i foreningslivet i over 25 år.\", \"phone\": \"27773240\", \"email\": \"jesper@krogh.cc\" }, { \"name\": \"Maria Jørgensen\", \"role\": \"Bestyrelsesmedlem\", \"bio\": \"\", \"phone\": \"28191290\", \"email\": \"zonen@c.dk\" }, { \"name\": \"Storm Kejser Hansen\", \"role\": \"Bestyrelsesmedlem, Træner Børn og Båd, Adventure\", \"bio\": \"\", \"phone\": \"93882407\", \"email\": \"stormkdk@icloud.com\" }, { \"name\": \"Danielle Ferguson\", \"role\": \"Bestyrelsesmedlem, Træner Adventure\", \"bio\": \"Mor til en ung begyndersejler i KØS, aktiv frivillig og hjælpetræner for Adventure Team. RYA Day Skipper-certifikat.\", \"phone\": \"50244242\", \"email\": \"daniellepferguson@gmail.com\" }, { \"name\": \"Anton Seehausen\", \"role\": \"Bestyrelsesmedlem, cheftræner\", \"bio\": \"\", \"phone\": \"20676460\", \"email\": \"anton@seehausen.nu\" } ], \"members_en\": [ { \"name\": \"Henning Seehausen\", \"role\": \"Chairman\", \"bio\": \"Parent and long-time volunteer. Chairman since January 2023. Sailing since youth. Passionate about creating good conditions for our children and youth.\", \"phone\": \"52390400\", \"email\": \"hse@sandwalk.dk\" }, { \"name\": \"Peter Ottesen\", \"role\": \"Treasurer\", \"bio\": \"Father of a beginner sailor. On the board since March 2024. Also chairman of JolleKolle.\", \"phone\": \"40271025\", \"email\": \"p_ottesen@icloud.com\" }, { \"name\": \"Jesper Krogh\", \"role\": \"Board member + beginner trainer Thursday\", \"bio\": \"Father of 2 beginner sailors in KØS. Active in associations for over 25 years.\", \"phone\": \"27773240\", \"email\": \"jesper@krogh.cc\" }, { \"name\": \"Maria Jørgensen\", \"role\": \"Board member\", \"bio\": \"\", \"phone\": \"28191290\", \"email\": \"zonen@c.dk\" }, { \"name\": \"Storm Kejser Hansen\", \"role\": \"Board member, Children & Boat trainer, Adventure\", \"bio\": \"\", \"phone\": \"93882407\", \"email\": \"stormkdk@icloud.com\" }, { \"name\": \"Danielle Ferguson\", \"role\": \"Board member, Adventure trainer\", \"bio\": \"Mother of a young beginner sailor in KØS, active volunteer and assistant trainer for Adventure Team. RYA Day Skipper certificate.\", \"phone\": \"50244242\", \"email\": \"daniellepferguson@gmail.com\" }, { \"name\": \"Anton Seehausen\", \"role\": \"Board member, head trainer\", \"bio\": \"\", \"phone\": \"20676460\", \"email\": \"anton@seehausen.nu\" } ] }, \"sikkerhed\": { \"title_da\": \"Sikkerhedspolitik\", \"title_en\": \"Safety Policy\", \"sections_da\": [ { \"title\": \"Mål\", \"text\": \"Sikkerhed er vores højeste prioritet i KØS Sejlsport. Vores mål er at sikre, at ingen kommer til skade under aktiviteterne, og at både sejlere, trænere og forældre føler sig trygge.\" }, { \"title\": \"Trænere\", \"text\": \"Trænernes kompetencer og adfærd er afgørende for sikkerheden. Vi fokuserer på faglige færdigheder inden for sejlads og svømning, førstehjælp og livredning, samt sikker sejlads med følgebåde.\" }, { \"title\": \"Krav til jollesejlere\", \"text\": \"En årlig kæntringsprøve under kontrollerede forhold. Dokumentation for at de kan svømme 200 meter med svømmevest og våddragt.\" }, { \"title\": \"Påkrævet sikkerhedsudstyr\", \"text\": \"Alle sejlere og forældre skal altid bære godkendte redningsveste eller svømmeveste på jollerampen, broer og i bådene. Selvoppustelige redningsveste er ikke tilladt.\" }, { \"title\": \"Følgebåde\", \"text\": \"Speedbådskørekort kræves. Medbringelse af VHF-radio og Mand-overbord-sikringssnor. Hastighedsbegrænsningen i Svanemøllebugten er 6 knob.\" }, { \"title\": \"Nødhjælp\", \"text\": \"Nødhjælpskasse i klubhuset. Redningskranse på optimistskuret. Hjertestarter ved Sejlklubben Sundets indgang.\" } ], \"sections_en\": [ { \"title\": \"Goal\", \"text\": \"Safety is our highest priority at KØS Sejlsport. Our goal is to ensure that no one is injured during activities.\" }, { \"title\": \"Trainers\", \"text\": \"Trainer competencies are crucial for safety. We focus on professional skills in sailing and swimming, first aid and lifesaving, and safe sailing with support boats.\" }, { \"title\": \"Requirements for dinghy sailors\", \"text\": \"An annual capsizing test under controlled conditions. Documentation that they can swim 200 meters.\" }, { \"title\": \"Required safety equipment\", \"text\": \"All sailors and parents must always wear approved life jackets on the dinghy ramp, bridges and in boats. Self-inflatable life jackets are not permitted.\" }, { \"title\": \"Support boats\", \"text\": \"Speedboat license required. VHF radio and Man overboard safety line required. Speed limit in Svanemølle Bay is 6 knots.\" }, { \"title\": \"Emergency aid\", \"text\": \"First aid kit in the clubhouse. Life rings on the optimist shed. Defibrillator at the entrance of Sejlklubben Sundet.\" } ] }, \"udmeldelse\": { \"title_da\": \"Udmeldelse\", \"title_en\": \"Resignation\", \"sections_da\": [ { \"title\": \"Forlader du os?\", \"text\": \"Det er vi selvfølgeligt kede af! Vi håber du har haft en god tid i KØS og gerne vil anbefale os til venner og bekendte.\" }, { \"title\": \"Sådan foregår udmelding\", \"text\": \"Udmeldelse sker via vores Google Formular: https://forms.gle/qPGCjq6VU5Nj4UwbA. Formularen stiller lidt spørgsmål fordi vi super gerne vil vide hvad vi har gjort godt og kan gøre endnu bedre. Udmeldelse fra Holdsport vil efterfølgende ske manuelt fra klubbens side.\" } ], \"sections_en\": [ { \"title\": \"Are you leaving us?\", \"text\": \"We're sorry to see you go! We hope you had a good time at KØS and would recommend us to friends and acquaintances.\" }, { \"title\": \"How to resign\", \"text\": \"Resignation is done via our Google Form: https://forms.gle/qPGCjq6VU5Nj4UwbA. The form asks a few questions because we'd really like to know what we did well and can do even better. Resignation from Holdsport will subsequently be done manually by the club.\" } ] } }, \"flade\": [ { \"slug\": \"optimist\", \"name_da\": \"Optimist\", \"name_en\": \"Optimist\", \"description_da\": \"Optimisten er verdens mest udbredte sejlbåd for børn og unge. Den er stabil, nem at sejle med og perfekt til at lære sejlsportens grundteknikker. Klubben har en flåde af Optimister til rådighed for Mini-Sejler og Begynder holdene.\", \"description_en\": \"The Optimist is the world's most popular sailing dinghy for children and young people. It's stable, easy to sail and perfect for learning the basics of sailing. The club has a fleet of Optimists available for the Mini-Sejler and Beginner teams.\", \"specs_da\": \"Længde: 2,31 m · Sejlareal: 3,3 m² · Vægt: 35 kg\", \"specs_en\": \"Length: 2.31 m · Sail area: 3.3 m² · Weight: 35 kg\", \"image_folder\": \"optimist\" }, { \"slug\": \"opticube\", \"name_da\": \"OptiCube\", \"name_en\": \"OptiCube\", \"description_da\": \"OptiCube er den moderne afløser for Optimisten — en let, stabil jolle med samme sejl men opdateret design. Perfekt til de yngste sejlere der skal have en tryg start på vandet.\", \"description_en\": \"The OptiCube is the modern successor to the Optimist — a light, stable dinghy with the same sail but updated design. Perfect for the youngest sailors who need a safe start on the water.\", \"specs_da\": \"Længde: 2,31 m · Sejlareal: 3,3 m²\", \"specs_en\": \"Length: 2.31 m · Sail area: 3.3 m²\", \"image_folder\": \"optimist\" }, { \"slug\": \"rs-tera\", \"name_da\": \"RS Tera\", \"name_en\": \"RS Tera\", \"description_da\": \"RS Tera er den perfekte overgangsbåd fra Optimist til større joller. Den findes i to sejlvarianter (Sport og Pro) så den kan vokse med sejleren. Populær til kapsejlads for ungdom.\", \"description_en\": \"The RS Tera is the perfect transition boat from Optimist to larger dinghies. It comes in two sail variants (Sport and Pro) so it can grow with the sailor. Popular for youth racing.\", \"specs_da\": \"Længde: 3,30 m · Sejlareal: 4,6 / 5,7 m²\", \"specs_en\": \"Length: 3.30 m · Sail area: 4.6 / 5.7 m²\", \"image_folder\": \"rstera\" }, { \"slug\": \"rs-feva\", \"name_da\": \"RS Feva\", \"name_en\": \"RS Feva\", \"description_da\": \"RS Feva er en tomandsjolle der er ideel til unge sejlere der vil lære at sejle sammen. Med storsejl, fok og gennaker får man en smagsprøve på hvad der venter i større både. Klubben har flere RS Feva'er.\", \"description_en\": \"The RS Feva is a two-person dinghy that's ideal for young sailors who want to learn to sail together. With mainsail, jib and gennaker you get a taste of what awaits in larger boats. The club has several RS Fevas.\", \"specs_da\": \"Længde: 3,63 m · Sejlareal: 8,7 m² · Mand: 2\", \"specs_en\": \"Length: 3.63 m · Sail area: 8.7 m² · Crew: 2\", \"image_folder\": \"rsfeva\" }, { \"slug\": \"rs-zest\", \"name_da\": \"RS Zest\", \"name_en\": \"RS Zest\", \"description_da\": \"RS Zest er en sportslig tomandsjolle for unge og voksne. Den er hurtig, responsiv og giver masser af adrenalinen. Perfekt til fortsætter- og øvede sejlere der vil have mere power.\", \"description_en\": \"The RS Zest is a sporty two-person dinghy for young people and adults. It's fast, responsive and delivers plenty of adrenaline. Perfect for intermediate and advanced sailors who want more power.\", \"specs_da\": \"Længde: 3,89 m · Sejlareal: 8,8 m² · Mand: 2\", \"specs_en\": \"Length: 3.89 m · Sail area: 8.8 m² · Crew: 2\", \"image_folder\": \"rszest\" }, { \"slug\": \"ilca-laser\", \"name_da\": \"ILCA / Laser\", \"name_en\": \"ILCA / Laser\", \"description_da\": \"ILCA (tidligere Laser) er verdens mest udbredte kapsejladsjolle. Enmandsjollen er krævende men utrolig givende — det er dig og båden mod vinden. Klubben har ILCA'er til øvede sejlere.\", \"description_en\": \"The ILCA (formerly Laser) is the world's most popular racing dinghy. The single-handed boat is demanding but incredibly rewarding — it's you and the boat against the wind. The club has ILCA's for advanced sailors.\", \"specs_da\": \"Længde: 4,23 m · Sejlareal: 4,7 / 7,06 m² · Mand: 1\", \"specs_en\": \"Length: 4.23 m · Sail area: 4.7 / 7.06 m² · Crew: 1\", \"image_folder\": \"ilca-laser\" }, { \"slug\": \"h-baad\", \"name_da\": \"H-Båd\", \"name_en\": \"H-Boat\", \"description_da\": \"H-Båden er en klassisk dansk konstruktion — en smuk og sej kølbåd til 3-4 personer. Den er perfekt til familier og sejlere der vil have en mere afslappet oplevelse på vandet med mulighed for længere ture.\", \"description_en\": \"The H-Boat is a classic Danish design — a beautiful and stable keelboat for 3-4 people. It's perfect for families and sailors who want a more relaxed experience on the water with the option of longer trips.\", \"specs_da\": \"Længde: 7,60 m · Sejlareal: 22,5 m² · Mand: 3-4\", \"specs_en\": \"Length: 7.60 m · Sail area: 22.5 m² · Crew: 3-4\", \"image_folder\": \"klubtur\" }, { \"slug\": \"j70\", \"name_da\": \"J70\", \"name_en\": \"J70\", \"description_da\": \"J70 er verdens mest populære sports-kølbåd — hurtig, moderne og med gennaker. Klubben har flere J70'er der bruges til træning, kapsejlads og adventure-ture. En fantastisk båd for unge og voksne der vil have fart over feltet.\", \"description_en\": \"The J70 is the world's most popular sports keelboat — fast, modern and with a gennaker. The club has several J70's used for training, racing and adventure trips. A fantastic boat for young people and adults who want speed.\", \"specs_da\": \"Længde: 6,93 m · Sejlareal: 27,9 m² · Mand: 3-4\", \"specs_en\": \"Length: 6.93 m · Sail area: 27.9 m² · Crew: 3-4\", \"image_folder\": \"j70\" } ], \"events\": [ { \"slug\": \"sommercamps\", \"name_da\": \"SommerCamp 2026\", \"name_en\": \"SummerCamp 2026\", \"date_da\": \"29. juni – 7. august 2026\", \"date_en\": \"June 29 – August 7, 2026\", \"tagline_da\": \"Sejl hele sommeren — 6 uger med vind, vand og fællesskab\", \"tagline_en\": \"Sail all summer — 6 weeks of wind, water and community\", \"description_da\": \"Hele skolernes sommerferie byder KØS Sejlsport på SommerCamp på Svanemøllen Havn. Campen kører i 6 uger, mandag til fredag kl. 09–15. Hver uge har sit eget tema og der er plads til alle — fra nybegyndere til erfarne sejlere fra 11 år.\", \"description_en\": \"Throughout the school summer holiday, KØS Sejlsport hosts SommerCamp at Svanemøllen Harbour. The camp runs for 6 weeks, Monday to Friday 09:00–15:00. Each week has its own theme and there's room for everyone — from beginners to experienced sailors aged 11+.\", \"weeks\": [ { \"week\": 27, \"dates_da\": \"29. juni – 3. juli\", \"dates_en\": \"June 29 – July 3\", \"desc_da\": \"Første campuge — bliv introduceret til livet på vandet\", \"desc_en\": \"First camp week — get introduced to life on the water\" }, { \"week\": 28, \"dates_da\": \"6. – 10. juli\", \"dates_en\": \"July 6–10\", \"desc_da\": \"Byg videre på dine sejlfærdigheder og find nye venner\", \"desc_en\": \"Build on your sailing skills and make new friends\" }, { \"week\": 29, \"dates_da\": \"13. – 17. juli\", \"dates_en\": \"July 13–17\", \"desc_da\": \"Adventure og fart — prøv kræfter med jollesejlads\", \"desc_en\": \"Adventure and speed — try your hand at dinghy sailing\" }, { \"week\": 30, \"dates_da\": \"20. – 24. juli\", \"dates_en\": \"July 20–24\", \"desc_da\": \"Fællesskab og sjov — sommerens bedste uge på havnen\", \"desc_en\": \"Community and fun — the best week of summer at the harbour\" }, { \"week\": 31, \"dates_da\": \"27. – 31. juli\", \"dates_en\": \"July 27–31\", \"desc_da\": \"Øv dine manøvrer og tag på mini-regatta med de andre\", \"desc_en\": \"Practice your manoeuvres and join a mini regatta with the others\" }, { \"week\": 32, \"dates_da\": \"3. – 7. august\", \"dates_en\": \"August 3–7\", \"desc_da\": \"Afslutningsuge — fest, sejlads og sommer-diplom\", \"desc_en\": \"Final week — celebration, sailing and summer diploma\" } ], \"signup_url\": \"https://www.kossejlsport.dk/klub/kos-sejlsport/sider/sommercamps-2026\", \"image_folder\": \"camp\" }, { \"slug\": \"sommer-i-kos\", \"name_da\": \"Sommer i KØS\", \"name_en\": \"Summer at KØS\", \"date_da\": \"Hele sommeren 2026\", \"date_en\": \"All summer 2026\", \"tagline_da\": \"Havnen summer af liv — kom og vær med\", \"tagline_en\": \"The harbour buzzes with life — come join in\", \"description_da\": \"Sommer i KØS er klubbens samlede sommeraktiviteter. Ud over SommerCampen er der åbne sejldage, familiedage, grill-aftener og sociale arrangementer hele sommeren. Følg med på Facebook og i nyhedsbrevet for datoer.\", \"description_en\": \"Summer at KØS is the club's collective summer activities. In addition to SommerCamp, there are open sailing days, family days, BBQ evenings and social events all summer. Follow us on Facebook and in the newsletter for dates.\", \"signup_url\": \"https://www.kossejlsport.dk\", \"image_folder\": \"socialt\" }, { \"slug\": \"svanemoellehavnsfestival\", \"name_da\": \"Svanemøllehavnsfestival\", \"name_en\": \"Svanemøllen Harbour Festival\", \"date_da\": \"TBD 2026\", \"date_en\": \"TBD 2026\", \"tagline_da\": \"Havnens store fest — sejlads, musik og fællesskab\", \"tagline_en\": \"The harbour's big celebration — sailing, music and community\", \"description_da\": \"Svanemøllehavnsfestivalen er den årlige fejring af havnelivet. KØS er med som aktiv deltager med opvisningssejlads, prøvetimer for børn og voksne, og vi er vært for en hyggelig havnefest. Mere info følger.\", \"description_en\": \"The Svanemøllen Harbour Festival is the annual celebration of harbour life. KØS participates actively with demonstration sailing, trial sessions for children and adults, and we host a cosy harbour party. More info to come.\", \"signup_url\": null, \"image_folder\": \"socialt\" } ] }"