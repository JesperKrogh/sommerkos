server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ── Static data files ─────────────────────────────────────────────────────
    location /data/ {
        alias   /usr/share/nginx/html/data/;
        expires 1h;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── API proxy to Flask ────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://api:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # ── Raw image files served directly by nginx ──────────────────────────────
    location /images/static/ {
        alias   /usr/share/nginx/images-web/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # ── Gallery SPA — /images/ and sub-paths ─────────────────────────────────
    location /images/ {
        try_files $uri /images/index.html;
    }

    # ── Main Vite SPA ─────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Aggressive long-term caching for Vite's content-hashed assets
    location ~* \.(js|css|woff2|woff|ttf|webp|avif|svg|ico|gif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # No caching for HTML entry points
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"                   always;
    add_header X-Content-Type-Options "nosniff"                     always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;

    # Gzip compression
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/javascript application/json application/xml
        image/svg+xml;
    gzip_min_length 1024;
}
